[project]
name = "open_cv_vision_exemples"
version = "0.1.0"
description = "Some projects to re-learn open cv"
readme = "README.md"
authors = [
    { name = "LeopoldBriand", email = "leopold.briand@laposte.net" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
bakery = "bakery:main"
components = "components:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
